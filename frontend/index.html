<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-TURNS — Sistema de Turnos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">
            <span class="logo-icon">🎫</span>
            <h1>E-TURNS</h1>
            <p>Sistema de Gestión de Turnos</p>
        </div>
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="usuario@eturns.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
            <div id="loginError" class="alert alert-error" style="display:none;"></div>
        </form>
    </div>

    <script>
        /**
         * NOTE: This login form uses a server-side API call for authentication.
         * Credentials are validated by the backend — never in client-side code for production use.
         * Demo fallback is only active when the backend is unavailable.
         */
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    window.location.href = 'admin/gestion_usuarios.html';
                } else {
                    const data = await res.json().catch(() => ({}));
                    err.textContent = data.error || 'Credenciales incorrectas.';
                    err.style.display = 'block';
                }
            } catch (_) {
                // Backend not reachable: allow demo access for development
                if (email === 'admin@eturns.com' && password === 'admin123') {
                    window.location.href = 'admin/gestion_usuarios.html';
                } else {
                    err.textContent = 'Credenciales incorrectas. (Demo: admin@eturns.com / admin123)';
                    err.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
