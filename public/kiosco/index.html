<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosco — E-TURNS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(90deg, #0d6efd, #198754);
      color: #fff;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.8rem; font-weight: 900; }
    header p { font-size: 1rem; opacity: 0.85; }
    #hospital-logo { max-height: 50px; }
    .container { padding: 2rem; max-width: 1000px; margin: 0 auto; }
    h2 { text-align: center; color: #333; margin-bottom: 2rem; font-size: 1.5rem; }
    .tipos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .tipo-btn {
      padding: 2.5rem 1rem;
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      min-height: 150px;
      justify-content: center;
    }
    .tipo-btn:hover { transform: scale(1.05); opacity: 0.92; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
    .tipo-btn:active { transform: scale(0.98); }
    .tipo-btn .icon { font-size: 2.5rem; }
    .tipo-btn.pref-btn { color: #333; }
    /* Modal de tipo preferencial */
    .modal-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      max-width: 700px;
      width: 95%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal h3 { font-size: 1.4rem; color: #333; margin-bottom: 1.5rem; }
    .modal .ticket-numero {
      font-size: 5rem;
      font-weight: 900;
      color: #0d6efd;
      margin: 1rem 0;
    }
    .modal .ticket-area { font-size: 1.3rem; color: #555; margin-bottom: 0.5rem; }
    .modal .ticket-tipo { font-size: 1rem; color: #888; margin-bottom: 0.5rem; }
    .modal .ticket-hora { font-size: 1rem; color: #888; margin-bottom: 2rem; }
    .modal-pref-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .modal-pref-grid .tipo-btn {
      padding: 1.5rem 0.75rem;
      font-size: 1rem;
      min-height: 110px;
    }
    .modal-pref-grid .tipo-btn .icon { font-size: 1.8rem; }
    .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #0d6efd; color: #fff; margin-right: 0.5rem; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .badge-pref {
      display: inline-block;
      background: #ffc107;
      color: #333;
      border-radius: 20px;
      padding: 0.2rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    footer { text-align: center; padding: 2rem; color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header id="kiosco-header">
    <div>
      <h1>E-TURNS</h1>
      <p id="hospital-nombre">Kiosco de Turnos</p>
    </div>
    <img id="hospital-logo" src="" alt="" style="display:none">
  </header>

  <div class="container">
    <h2>Seleccione el tipo de atención</h2>
    <div class="tipos-grid">
      <button class="tipo-btn" style="background:#0d6efd" onclick="solicitarTurno('Asegurado')">
        Asegurado
      </button>
      <button class="tipo-btn" style="background:#6f42c1" onclick="solicitarTurno('No Asegurado')">
        No Asegurado
      </button>
      <button class="tipo-btn" style="background:#20c997" onclick="solicitarTurno('Entrega de Resultados')">
        Entrega de Resultados
      </button>
      <button class="tipo-btn" style="background:#198754" onclick="solicitarTurno('Toma de Muestra')">
        Toma de Muestra
      </button>
      <button class="tipo-btn" style="background:#fd7e14" onclick="solicitarTurno('Pre-Empleo')">
        Pre-Empleo
      </button>
      <button class="tipo-btn pref-btn" style="background:#ffc107" onclick="abrirModalPreferencial()">
        ⭐ Turno Preferencial
      </button>
    </div>
  </div>

  <!-- Modal: selección de tipo para turno preferencial -->
  <div class="modal-overlay" id="modal-preferencial">
    <div class="modal">
      <h3>⭐ Turno Preferencial — Seleccione tipo</h3>
      <div class="modal-pref-grid">
        <button class="tipo-btn" style="background:#0d6efd" onclick="solicitarTurnoPref('Asegurado')">
          Asegurado
        </button>
        <button class="tipo-btn" style="background:#6f42c1" onclick="solicitarTurnoPref('No Asegurado')">
          No Asegurado
        </button>
        <button class="tipo-btn" style="background:#20c997" onclick="solicitarTurnoPref('Entrega de Resultados')">
          Entrega de Resultados
        </button>
        <button class="tipo-btn" style="background:#198754" onclick="solicitarTurnoPref('Toma de Muestra')">
          Toma de Muestra
        </button>
        <button class="tipo-btn" style="background:#fd7e14" onclick="solicitarTurnoPref('Pre-Empleo')">
          Pre-Empleo
        </button>
      </div>
      <button class="btn btn-secondary" onclick="cerrarModalPreferencial()">Cancelar</button>
    </div>
  </div>

  <!-- Modal de ticket -->
  <div class="modal-overlay" id="modal-ticket">
    <div class="modal">
      <h3>¡Su turno ha sido generado!</h3>
      <div id="ticket-pref-badge"></div>
      <div class="ticket-numero" id="ticket-numero">--</div>
      <div class="ticket-area" id="ticket-area">--</div>
      <div class="ticket-tipo" id="ticket-tipo"></div>
      <div class="ticket-hora" id="ticket-hora">--</div>
      <p style="color:#555;margin-bottom:1.5rem">Por favor espere a ser llamado.</p>
      <button class="btn btn-primary" onclick="imprimirTicket()">🖨️ Imprimir</button>
      <button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <footer>E-TURNS — Sistema de Turnos &copy; 2024</footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="kiosco.js"></script>
</body>
</html>
