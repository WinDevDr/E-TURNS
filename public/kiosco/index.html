<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosco — E-TURNS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(90deg, #0d6efd, #198754);
      color: #fff;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.8rem; font-weight: 900; }
    header p { font-size: 1rem; opacity: 0.85; }
    #hospital-logo { max-height: 50px; }
    .container { padding: 2rem; max-width: 900px; margin: 0 auto; }
    h2 { text-align: center; color: #333; margin-bottom: 2rem; font-size: 1.5rem; }
    #areas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .area-btn {
      padding: 2.5rem 1rem;
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .area-btn:hover { transform: scale(1.05); opacity: 0.92; }
    .area-btn .prefijo { font-size: 2.5rem; font-weight: 900; display: none; }
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 3rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal .ticket-numero {
      font-size: 5rem;
      font-weight: 900;
      color: #0d6efd;
      margin: 1rem 0;
    }
    .modal .ticket-area { font-size: 1.3rem; color: #555; margin-bottom: 0.5rem; }
    .modal .ticket-hora { font-size: 1rem; color: #888; margin-bottom: 2rem; }
    .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #0d6efd; color: #fff; margin-right: 0.5rem; }
    .btn-secondary { background: #6c757d; color: #fff; }
    footer { text-align: center; padding: 2rem; color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>E-TURNS</h1>
      <p id="hospital-nombre">Kiosco de Turnos</p>
    </div>
    <img id="hospital-logo" src="" alt="" style="display:none">
  </header>

  <div class="container">
    <h2>Seleccione el área de atención</h2>
    <div id="areas-grid">
      <p style="text-align:center;color:#888">Cargando áreas...</p>
    </div>
  </div>

  <!-- Modal de ticket -->
  <div class="modal-overlay" id="modal-ticket">
    <div class="modal">
      <h3>¡Su turno ha sido generado!</h3>
      <div class="ticket-numero" id="ticket-numero">--</div>
      <div class="ticket-area" id="ticket-area">--</div>
      <div class="ticket-hora" id="ticket-hora">--</div>
      <p style="color:#555;margin-bottom:1.5rem">Por favor espere a ser llamado.</p>
      <button class="btn btn-primary" onclick="imprimirTicket()">🖨️ Imprimir</button>
      <button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <footer>E-TURNS — Sistema de Turnos &copy; 2024</footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="kiosco.js"></script>
</body>
</html>
