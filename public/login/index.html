<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — E-TURNS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Comfortaa', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #FF8500 0%, #ff6000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-area .sistema-logo {
      max-height: 90px;
      max-width: 220px;
      object-fit: contain;
      margin-bottom: 0.75rem;
    }
    .logo-area h1 {
      font-size: 1.8rem;
      font-weight: 900;
      color: #FF8500;
      letter-spacing: -1px;
    }
    .logo-area p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block;
      font-weight: 600;
      color: #444;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }
    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #dee2e6;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: #333;
      background: #fafafa;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #FF8500;
      box-shadow: 0 0 0 3px rgba(255,133,0,0.14);
      background: #fff;
    }
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(90deg, #FF8500, #ff6000);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      display: none;
    }
    .alert-error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    .footer-info {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }
    /* Paso 2: selección de sucursal */
    #step-sucursal { display: none; }
    .sucursal-select-wrap { margin-bottom: 1.2rem; }
    .sucursal-select-wrap select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #FF8500;
      border-radius: 10px;
      font-size: 1rem;
      color: #333;
      background: #fafafa;
      cursor: pointer;
    }
    .bienvenida {
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 1.2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-area">
      <div id="logo-wrapper"></div>
      <h1 id="titulo-sistema">E-TURNS</h1>
      <p id="nombre-hospital">Sistema Electrónico de Turnos</p>
    </div>

    <div class="alert alert-error" id="alerta-error"></div>

    <!-- Paso 1: Credenciales -->
    <form id="step-credenciales" autocomplete="off">
      <div class="form-group">
        <label for="username">👤 Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">🔒 Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
      </div>
      <button type="submit" class="btn-login">🔑 Ingresar</button>
    </form>

    <!-- Paso 2: Selección de sucursal (aparece después del login exitoso) -->
    <div id="step-sucursal">
      <p class="bienvenida" id="bienvenida-texto">Bienvenido. Seleccione su sucursal:</p>
      <div class="sucursal-select-wrap">
        <select id="sucursal-select" size="1">
          <option value="">-- Seleccione una sucursal --</option>
        </select>
      </div>
      <button class="btn-login" onclick="confirmarSucursal()">Acceder</button>
    </div>

    <div class="footer-info">
      E-TURNS &copy; 2024 · Sistema de Gestión de Turnos
    </div>
  </div>

  <script>
    let rolPendiente = '';

    // Cargar logo y nombre del hospital
    fetch('/api/config')
      .then(r => r.json())
      .then(config => {
        if (config.nombre) {
          document.getElementById('nombre-hospital').textContent = config.nombre;
          document.title = 'Iniciar Sesión — ' + config.nombre;
        }
        const logoUrl = config.logo_url || config.logo;
        if (logoUrl) {
          const img = document.createElement('img');
          img.src = logoUrl;
          img.className = 'sistema-logo';
          img.alt = 'Logo';
          img.onerror = () => {};
          document.getElementById('logo-wrapper').appendChild(img);
          document.getElementById('titulo-sistema').style.display = 'none';
        }
        // Aplicar colores de marca
        const primario = config.colorPrimario || '#FF8500';
        document.querySelector('.btn-login').style.background = `linear-gradient(90deg, ${primario}, ${primario}cc)`;
        document.body.style.background = `linear-gradient(135deg, ${primario} 0%, ${primario}cc 100%)`;
      })
      .catch(() => {});

    // Paso 1: submit de credenciales
    document.getElementById('step-credenciales').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alerta = document.getElementById('alerta-error');
      alerta.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        alerta.textContent = 'Por favor complete todos los campos.';
        alerta.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          alerta.textContent = data.error || 'Credenciales inválidas.';
          alerta.style.display = 'block';
          return;
        }

        rolPendiente = data.rol;

        if (data.sucursales && data.sucursales.length > 1) {
          // Mostrar paso 2: selección de sucursal (dropdown)
          document.getElementById('step-credenciales').style.display = 'none';
          document.getElementById('step-sucursal').style.display = 'block';
          document.getElementById('bienvenida-texto').textContent =
            `Bienvenido, ${data.nombre || data.username}. Seleccione su sucursal:`;

          const sel = document.getElementById('sucursal-select');
          sel.innerHTML = '<option value="">-- Seleccione una sucursal --</option>';
          data.sucursales.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.nombre;
            sel.appendChild(opt);
          });
          // Si solo hay unas pocas, hacerlo más visible
          sel.size = Math.min(data.sucursales.length + 1, 6);
        } else {
          // Sin selección de sucursal → redirigir directo
          redirigirPorRol(data.rol);
        }
      } catch (err) {
        document.getElementById('alerta-error').textContent = 'Error de conexión. Intente nuevamente.';
        document.getElementById('alerta-error').style.display = 'block';
      }
    });

    async function confirmarSucursal() {
      const sel = document.getElementById('sucursal-select');
      const sucursalId = parseInt(sel.value);
      if (!sucursalId) {
        const alerta = document.getElementById('alerta-error');
        alerta.textContent = 'Por favor seleccione una sucursal.';
        alerta.style.display = 'block';
        return;
      }
      await seleccionarSucursal(sucursalId, sel.options[sel.selectedIndex].textContent);
    }

    async function seleccionarSucursal(sucursalId, sucursalNombre) {
      const alerta = document.getElementById('alerta-error');
      alerta.style.display = 'none';
      try {
        const res = await fetch('/auth/select-branch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sucursal_id: sucursalId })
        });
        const data = await res.json();
        if (!res.ok) {
          alerta.textContent = data.error || 'Error al seleccionar sucursal.';
          alerta.style.display = 'block';
          return;
        }
        redirigirPorRol(rolPendiente);
      } catch (err) {
        alerta.textContent = 'Error de conexión.';
        alerta.style.display = 'block';
      }
    }

    function redirigirPorRol(rol) {
      if (rol === 'admin') {
        window.location.href = '/home';
      } else {
        window.location.href = '/panel';
      }
    }
  </script>
</body>
</html>
