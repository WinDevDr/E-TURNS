<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Sucursal — Pantalla</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    #hospital-logo {
      max-height: 80px;
      max-width: 220px;
      object-fit: contain;
      margin-bottom: 1rem;
      display: none;
    }
    #hospital-nombre {
      font-size: 1.6rem;
      font-weight: 900;
      color: #FF8500;
      margin-bottom: 0.25rem;
    }
    h2 {
      font-size: 1.05rem;
      color: #adb5bd;
      font-weight: 500;
      margin-bottom: 1.75rem;
    }
    .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .form-group { margin-bottom: 1.25rem; text-align: left; }
    label { display: block; font-weight: 600; color: #ced4da; margin-bottom: 0.4rem; font-size: 0.95rem; }
    select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      font-size: 1rem;
      color: #fff;
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select option { background: #1a1a4e; color: #fff; }
    select:focus { outline: none; border-color: #FF8500; }
    .btn-confirm {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(90deg, #FF8500, #e06000);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-confirm:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-confirm:active { transform: translateY(0); }
    .alert-error {
      padding: 0.7rem 1rem;
      background: rgba(220,53,69,0.3);
      color: #f8d7da;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }
    footer { margin-top: 1.5rem; font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📺</div>
    <img id="hospital-logo" src="" alt="Logo">
    <div id="hospital-nombre">E-TURNS</div>
    <h2>Seleccione la sucursal de esta pantalla</h2>

    <div class="alert-error" id="alerta"></div>

    <div class="form-group">
      <label for="sucursal-select">🏢 Sucursal</label>
      <select id="sucursal-select">
        <option value="">— Cargando sucursales... —</option>
      </select>
    </div>

    <button class="btn-confirm" onclick="confirmar()">✅ Confirmar y Entrar a la Pantalla</button>

    <footer>E-TURNS &copy; 2024 · Sistema de Gestión de Turnos</footer>
  </div>

  <script>
    const STORAGE_KEY = 'eturn_pantalla_sucursal';

    async function cargarConfig() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.nombre) {
          document.getElementById('hospital-nombre').textContent = config.nombre;
          document.title = 'Seleccionar Sucursal — ' + config.nombre;
        }
        const logoUrl = config.logo_url || config.logo;
        if (logoUrl) {
          const logo = document.getElementById('hospital-logo');
          logo.src = logoUrl;
          logo.style.display = 'block';
          document.getElementById('hospital-nombre').style.display = 'none';
        }
        if (config.font_family) document.body.style.fontFamily = config.font_family;
      } catch (e) {}
    }

    async function cargarSucursales() {
      try {
        const res = await fetch('/api/sucursales/public');
        const sucursales = await res.json();
        const sel = document.getElementById('sucursal-select');

        if (!sucursales || sucursales.length === 0) {
          sel.innerHTML = '<option value="">— Sin sucursales configuradas —</option>';
          return;
        }

        sel.innerHTML = '<option value="">— Seleccione una sucursal —</option>';
        sucursales.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.nombre;
          sel.appendChild(opt);
        });

        if (sucursales.length === 1) {
          sel.value = sucursales[0].id;
        }

        sel.size = Math.min(sucursales.length + 1, 7);
      } catch (e) {
        document.getElementById('alerta').textContent = 'Error al cargar sucursales.';
        document.getElementById('alerta').style.display = 'block';
      }
    }

    function confirmar() {
      const sel = document.getElementById('sucursal-select');
      const id = parseInt(sel.value);
      if (!id || id <= 0) {
        document.getElementById('alerta').textContent = 'Por favor seleccione una sucursal.';
        document.getElementById('alerta').style.display = 'block';
        return;
      }
      document.getElementById('alerta').style.display = 'none';
      const nombre = sel.options[sel.selectedIndex].textContent;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ id, nombre }));
      window.location.href = '/pantalla';
    }

    cargarConfig();
    cargarSucursales();
  </script>
</body>
</html>
