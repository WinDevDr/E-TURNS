<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla — E-TURNS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a;
      color: #fff;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: auto 1fr auto;
    }
    header {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, #0d6efd, #198754);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; }
    #reloj { font-size: 1.4rem; font-weight: 700; font-family: monospace; }
    .turno-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }
    .turno-etiqueta { font-size: 1.2rem; color: #adb5bd; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 3px; }
    .turno-numero {
      font-size: 10rem;
      font-weight: 900;
      color: #0dcaf0;
      text-shadow: 0 0 40px rgba(13,202,240,0.4);
      line-height: 1;
      margin-bottom: 1.5rem;
      transition: all 0.3s;
    }
    .turno-area {
      font-size: 2rem;
      color: #adb5bd;
      margin-bottom: 0.75rem;
    }
    .turno-ventanilla {
      font-size: 1.5rem;
      background: #0d6efd;
      color: #fff;
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      font-weight: 700;
    }
    .sin-turno { color: #495057; font-style: italic; font-size: 2rem; }
    .video-panel {
      border-left: 2px solid #1e1e3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d2b;
      padding: 1rem;
    }
    .video-panel iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      border-radius: 10px;
    }
    .video-panel p { color: #6c757d; margin-top: 0.5rem; font-size: 0.8rem; text-align: center; }
    footer {
      grid-column: 1 / -1;
      background: #050510;
      padding: 0.75rem 2rem;
      text-align: center;
      color: #495057;
      font-size: 0.85rem;
    }
    #mensaje-footer { font-style: italic; }
    .historial {
      margin-top: 2rem;
      max-width: 400px;
      width: 100%;
    }
    .historial h4 { color: #6c757d; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; }
    .historial-item {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid #1e1e3a;
      color: #adb5bd;
      font-size: 0.95rem;
    }
    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .nuevo-turno { animation: parpadeo 0.8s ease 3; }
  </style>
</head>
<body>
  <header id="header-bar">
    <div style="display:flex;align-items:center;gap:1rem">
      <img id="hospital-logo" src="" alt="Logo" style="display:none;max-height:50px;max-width:140px;object-fit:contain">
      <h1 id="hospital-nombre">E-TURNS</h1>
    </div>
    <div id="reloj">--:--:--</div>
  </header>
  <style id="turno-ventanilla-style"></style>

  <div class="turno-panel">
    <div class="turno-etiqueta">Turno en atención</div>
    <div class="turno-numero sin-turno" id="turno-numero">---</div>
    <div class="turno-area" id="turno-area"></div>
    <div class="turno-ventanilla" id="turno-ventanilla" style="display:none"></div>

    <div class="historial">
      <h4>Últimos turnos llamados</h4>
      <div id="historial-list"></div>
    </div>
  </div>

  <div class="video-panel">
    <iframe id="video-frame" src="" allowfullscreen></iframe>
    <video id="video-uploaded" src="" autoplay muted loop style="display:none;width:100%;border-radius:10px"></video>
    <p>Entretenimiento mientras espera</p>
  </div>

  <footer>
    <span id="mensaje-footer">Bienvenido al sistema de turnos electrónico</span>
    &nbsp;|&nbsp;
    <span id="horario-footer"></span>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let historial = [];

    // Reloj
    function actualizarReloj() {
      document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-ES');
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // Cargar configuración
    async function cargarConfig() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.nombre) document.getElementById('hospital-nombre').textContent = config.nombre;

        // Logo
        const logoUrl = config.logo_url || config.logo;
        if (logoUrl) {
          const logoEl = document.getElementById('hospital-logo');
          logoEl.src = logoUrl;
          logoEl.style.display = 'block';
          document.getElementById('hospital-nombre').style.display = 'none';
        }

        // Colores dinámicos
        const colorPrimario = config.colorPrimario || '#0d6efd';
        const colorSecundario = config.colorSecundario || '#198754';
        document.getElementById('header-bar').style.background =
          `linear-gradient(90deg, ${colorPrimario}, ${colorSecundario})`;
        document.getElementById('turno-ventanilla-style').textContent =
          `.turno-ventanilla { background: ${colorPrimario}; }`;

        // Video
        if (config.video_fuente === 'archivo' && config.video_url) {
          const videoEl = document.getElementById('video-uploaded');
          if (videoEl) {
            videoEl.src = config.video_url;
            videoEl.style.display = 'block';
            videoEl.play().catch((err) => { console.warn('Autoplay bloqueado por el navegador:', err); });
          }
          document.getElementById('video-frame').style.display = 'none';
        } else if (config.videoYoutube) {
          const videoFrame = document.getElementById('video-frame');
          videoFrame.src = config.videoYoutube + '?autoplay=1&mute=1&loop=1';
          videoFrame.style.display = 'block';

          // Tamaño de video
          const sizeMap = { 'pequeño': '25%', 'mediano': '40%', 'grande': '60%', 'completo': '100%' };
          const videoSize = config.video_size ? sizeMap[config.video_size] || config.video_size : null;
          if (videoSize) {
            const videoPanel = document.querySelector('.video-panel');
            if (videoSize === '100%') {
              videoPanel.style.width = '100%';
              document.body.style.gridTemplateColumns = '1fr';
              videoPanel.style.position = 'fixed';
              videoPanel.style.inset = '0';
              videoPanel.style.zIndex = '-1';
              videoPanel.style.borderLeft = 'none';
            } else {
              videoPanel.style.width = videoSize;
              document.body.style.gridTemplateColumns = `1fr ${videoSize}`;
            }
          }
        }

        if (config.color_fondo_pantalla) {
          document.body.style.background = config.color_fondo_pantalla;
        }

        // Horario
        if (config.horario_apertura || config.horario_cierre) {
          const apertura = config.horario_apertura || '07:00';
          const cierre = config.horario_cierre || '17:00';
          const horarioEl = document.getElementById('horario-footer');
          if (horarioEl) horarioEl.textContent = `Horario: ${apertura} - ${cierre}`;
        }

        if (config.mensaje) document.getElementById('mensaje-footer').textContent = config.mensaje;

        // Voz TTS
        if (config.voz_tts) {
          window._vozTts = config.voz_tts;
        }
      } catch (e) {}
    }

    // Mostrar turno llamado
    function mostrarTurno(turno) {
      const numEl = document.getElementById('turno-numero');
      numEl.classList.remove('sin-turno', 'nuevo-turno');
      numEl.textContent = turno.numero;
      void numEl.offsetWidth; // reflow para reiniciar animación
      numEl.classList.add('nuevo-turno');

      document.getElementById('turno-area').textContent = turno.area || '';
      const ventEl = document.getElementById('turno-ventanilla');
      if (turno.ventanilla) {
        ventEl.textContent = turno.ventanilla;
        ventEl.style.display = 'block';
      } else {
        ventEl.style.display = 'none';
      }

      // Agregar al historial
      historial.unshift(turno);
      if (historial.length > 5) historial.pop();
      renderHistorial();

      // TTS — anuncio por voz
      anunciarVoz(turno);
    }

    function renderHistorial() {
      const el = document.getElementById('historial-list');
      el.innerHTML = historial.slice(1).map(t => `
        <div class="historial-item">
          <span>${t.numero}</span>
          <span>${t.area}</span>
          <span style="color:#6c757d;font-size:0.8rem">${t.ventanilla || ''}</span>
        </div>
      `).join('');
    }

    // Text-to-Speech
    function anunciarVoz(turno) {
      if (!window.speechSynthesis) return;
      const msg = new SpeechSynthesisUtterance();
      const ventanilla = turno.ventanilla ? `, diríjase a ${turno.ventanilla}` : '';
      msg.text = `Turno ${turno.numero}, área ${turno.area}${ventanilla}`;
      msg.rate = 0.9;
      msg.volume = 1;

      const vozNombre = window._vozTts || null;
      const voices = window.speechSynthesis.getVoices();
      let vozSeleccionada = null;

      if (vozNombre && voices.length > 0) {
        vozSeleccionada = voices.find(v => v.name === vozNombre) || null;
      }
      if (!vozSeleccionada && voices.length > 0) {
        vozSeleccionada = voices.find(v => v.lang && v.lang.startsWith('es')) || null;
      }

      if (vozSeleccionada) {
        msg.voice = vozSeleccionada;
      } else {
        msg.lang = 'es-ES';
      }

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    }

    // Socket.IO
    socket.on('turn_called', (turno) => {
      mostrarTurno(turno);
    });

    // Inicializar
    cargarConfig();
  </script>
</body>
</html>
