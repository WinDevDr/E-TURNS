<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla — E-TURNS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(90deg, #0d6efd, #198754);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; }
    #reloj { font-size: 1.4rem; font-weight: 700; font-family: monospace; }
    .turnos-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 2rem;
      gap: 1rem;
      overflow-y: auto;
    }
    .turno-card {
      background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
      border: 2px solid #0dcaf0;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      box-shadow: 0 0 20px rgba(13,202,240,0.15);
    }
    .turno-card:first-child {
      background: linear-gradient(135deg, #0d6efd33, #0dcaf033);
      border-color: #0dcaf0;
      box-shadow: 0 0 40px rgba(13,202,240,0.3);
    }
    .turno-card .turno-numero {
      font-size: 5rem;
      font-weight: 900;
      color: #0dcaf0;
      text-shadow: 0 0 30px rgba(13,202,240,0.4);
      line-height: 1;
      min-width: 200px;
      text-align: center;
    }
    .turno-card:first-child .turno-numero {
      font-size: 6rem;
    }
    .turno-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .turno-card .turno-area {
      font-size: 1.8rem;
      color: #adb5bd;
      font-weight: 600;
    }
    .turno-card .turno-ventanilla {
      display: inline-block;
      font-size: 1.3rem;
      background: #0d6efd;
      color: #fff;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      font-weight: 700;
      width: fit-content;
    }
    .sin-turno-msg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #495057;
      font-style: italic;
      font-size: 2.5rem;
    }
    footer {
      background: #050510;
      padding: 0.75rem 2rem;
      text-align: center;
      color: #495057;
      font-size: 0.85rem;
    }
    #mensaje-footer { font-style: italic; }
    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .nuevo-turno { animation: parpadeo 0.8s ease 3; }
  </style>
</head>
<body>
  <header>
    <h1 id="hospital-nombre">E-TURNS</h1>
    <div id="reloj">--:--:--</div>
  </header>

  <div class="turnos-container" id="turnos-container">
    <div class="sin-turno-msg">Esperando turnos...</div>
  </div>

  <footer>
    <span id="mensaje-footer">Bienvenido al sistema de turnos electrónico</span>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let turnosLlamados = [];

    // Reloj
    function actualizarReloj() {
      document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-ES');
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // Cargar configuración
    async function cargarConfig() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.nombre) document.getElementById('hospital-nombre').textContent = config.nombre;
        if (config.mensaje) document.getElementById('mensaje-footer').textContent = config.mensaje;
      } catch (e) {}
    }

    // Renderizar lista de turnos llamados
    function renderTurnosLlamados() {
      const container = document.getElementById('turnos-container');
      if (turnosLlamados.length === 0) {
        container.innerHTML = '<div class="sin-turno-msg">Esperando turnos...</div>';
        return;
      }

      container.innerHTML = turnosLlamados.map((turno, index) => `
        <div class="turno-card${index === 0 ? ' nuevo-turno' : ''}">
          <div class="turno-numero">${turno.numero}</div>
          <div class="turno-info">
            <div class="turno-area">${turno.area || ''}</div>
            ${turno.ventanilla ? `<div class="turno-ventanilla">${turno.ventanilla}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    // Mostrar turno llamado
    function mostrarTurno(turno) {
      // Remover si ya existe (para re-llamadas)
      turnosLlamados = turnosLlamados.filter(t => t.numero !== turno.numero);
      // Agregar al inicio
      turnosLlamados.unshift(turno);
      // Mantener máximo 8 turnos visibles
      if (turnosLlamados.length > 8) turnosLlamados.pop();
      renderTurnosLlamados();

      // TTS — anuncio por voz
      anunciarVoz(turno);
    }

    // Text-to-Speech
    function anunciarVoz(turno) {
      if (!window.speechSynthesis) return;
      const msg = new SpeechSynthesisUtterance();
      msg.lang = 'es-ES';
      const ventanilla = turno.ventanilla ? `, diríjase a ${turno.ventanilla}` : '';
      msg.text = `Turno ${turno.numero}, área ${turno.area}${ventanilla}`;
      msg.rate = 0.9;
      msg.volume = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    }

    // Socket.IO
    socket.on('turn_called', (turno) => {
      mostrarTurno(turno);
    });

    // Inicializar
    cargarConfig();
  </script>
</body>
</html>
