<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla — E-TURNS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== MAIN SCREEN (fills all space above ticker) ===== */
    .screen {
      display: grid;
      grid-template-columns: 50fr 50fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ===== LEFT PANEL: current turn + badge list ===== */
    .panel-turno {
      display: flex;
      flex-direction: column;
      padding: 1.2rem 1.5rem 0.75rem;
      border-right: 2px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    #hospital-logo {
      max-height: 70px;
      max-width: 240px;
      object-fit: contain;
      display: none;
    }
    #hospital-nombre {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    /* Big current turn */
    .turno-llamada-wrap {
      text-align: center;
      padding: 0.5rem 0;
      flex-shrink: 0;
    }
    .turno-etiqueta {
      font-size: 0.78rem;
      color: #adb5bd;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 0.1rem;
    }
    .turno-numero {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      color: #FF8500;
      text-shadow: 0 0 60px rgba(255,133,0,0.55);
      transition: all 0.3s;
    }
    .turno-numero.sin-turno {
      font-size: 3.5rem;
      color: #333;
      font-style: italic;
      text-shadow: none;
    }
    .turno-area {
      font-size: 1.2rem;
      color: #adb5bd;
      margin-top: 0.15rem;
    }
    .turno-puesto {
      margin-top: 0.4rem;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.25rem 1rem;
      border-radius: 30px;
      background: #FF8500;
      display: none;
      margin-left: auto;
      margin-right: auto;
      width: fit-content;
    }

    @keyframes llamada-entrada {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .animando {
      animation: llamada-entrada 0.45s ease-out, parpadeo 0.65s ease 0.5s 4;
    }

    /* ===== BADGE LIST of all called turns ===== */
    .turnos-lista-titulo {
      font-size: 0.68rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 0.4rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid #1e1e3a;
      text-align: center;
      flex-shrink: 0;
    }
    .turnos-badges-wrap {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-content: flex-start;
      justify-content: center;
      padding: 0.4rem 0;
    }
    .turno-badge {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 0.55rem 1.1rem;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      min-width: 90px;
      text-align: center;
    }
    .turno-badge.mas-reciente {
      background: rgba(255,133,0,0.2);
      border-color: #FF8500;
      color: #FF8500;
      font-size: 1.8rem;
    }
    .turno-badge .badge-puesto {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: #aaa;
      margin-top: 0.15rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .turno-badge.mas-reciente .badge-puesto { color: #FF8500cc; }

    /* ===== RIGHT PANEL: clock + video ===== */
    .panel-media {
      display: flex;
      flex-direction: column;
      background: #050514;
    }
    .media-clock {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    #reloj {
      font-size: 2rem;
      font-weight: 900;
      font-family: monospace;
      color: #FF8500;
    }
    #fecha-display {
      font-size: 0.9rem;
      color: #6c757d;
      text-align: right;
    }
    .media-video {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      overflow: hidden;
      min-height: 0;
    }
    .media-video iframe,
    .media-video video {
      width: 100%;
      border-radius: 12px;
      border: none;
      max-height: 100%;
    }
    .media-video iframe { aspect-ratio: 16/9; }
    .media-video video { height: 100%; object-fit: contain; }

    /* ===== FULL-WIDTH SCROLLING TICKER (below both panels) ===== */
    .ticker-wrap {
      background: rgba(0,0,0,0.6);
      border-top: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      padding: 0.45rem 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ticker-content {
      display: inline-block;
      animation: ticker-scroll 30s linear infinite;
      font-size: 1rem;
      color: #adb5bd;
      padding-left: 100%;
    }
    .ticker-content .sep { margin: 0 2rem; color: #FF8500; }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <style id="dynamic-styles"></style>

  <div class="screen">
    <!-- LEFT: current turn + badge list -->
    <div class="panel-turno">
      <div class="logo-wrap">
        <img id="hospital-logo" src="" alt="Logo">
        <span id="hospital-nombre">E-TURNS</span>
      </div>

      <div class="turno-llamada-wrap">
        <div class="turno-etiqueta">Turno en atención</div>
        <div class="turno-numero sin-turno" id="turno-numero">---</div>
        <div class="turno-area" id="turno-area"></div>
        <div class="turno-puesto" id="turno-puesto"></div>
      </div>

      <div class="turnos-lista-titulo">Turnos llamados hoy</div>
      <div class="turnos-badges-wrap" id="turnos-badges"></div>
    </div>

    <!-- RIGHT: clock + video -->
    <div class="panel-media">
      <div class="media-clock">
        <div id="reloj">--:--:--</div>
        <div id="fecha-display"></div>
      </div>
      <div class="media-video">
        <iframe id="video-frame" src="" allowfullscreen style="display:none"></iframe>
        <video id="video-uploaded" src="" autoplay muted loop style="display:none"></video>
      </div>
    </div>
  </div>

  <!-- FULL-WIDTH TICKER -->
  <div class="ticker-wrap">
    <div class="ticker-content" id="ticker-content">
      <span id="ticker-mensaje">Bienvenido al sistema de turnos electrónico</span>
      <span class="sep">◆</span>
      <span id="ticker-horario"></span>
      <span class="sep">◆</span>
      <span id="ticker-nombre"></span>
      <span class="sep">◆</span>
      <span>Gracias por su visita</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const STORAGE_KEY = 'eturn_pantalla_sucursal';
    let turnosLlamados = [];
    const MAX_LISTA = 50;
    let sucursalId = null;

    // ===== BRANCH CHECK — redirect if no branch =====
    (function () {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Number.isInteger(Number(parsed.id)) && Number(parsed.id) > 0) {
            sucursalId = parseInt(parsed.id, 10);
            return;
          }
        } catch (e) { console.warn('Error leyendo sucursal en localStorage:', e); }
        localStorage.removeItem(STORAGE_KEY);
      }
      window.location.href = '/pantalla-select';
    })();

    // ===== CLOCK =====
    function actualizarReloj() {
      const ahora = new Date();
      document.getElementById('reloj').textContent = ahora.toLocaleTimeString('es-ES');
      document.getElementById('fecha-display').textContent = ahora.toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // ===== CONFIG =====
    async function cargarConfig() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        const nombre = config.nombre || 'E-TURNS';
        document.getElementById('ticker-nombre').textContent = nombre;

        const logoUrl = config.logo_url || config.logo;
        if (logoUrl) {
          const logoEl = document.getElementById('hospital-logo');
          logoEl.src = logoUrl;
          logoEl.style.display = 'block';
          document.getElementById('hospital-nombre').style.display = 'none';
        } else {
          document.getElementById('hospital-nombre').textContent = nombre;
        }

        if (config.color_fondo_pantalla) {
          document.body.style.background = config.color_fondo_pantalla;
          document.querySelector('.panel-media').style.background = adjustColor(config.color_fondo_pantalla, -15);
        }

        const colorPrimario = config.color_pantalla_primario || config.colorPrimario || '#FF8500';
        const colorSecundario = config.color_pantalla_secundario || config.colorSecundario || '#e06000';
        document.getElementById('dynamic-styles').textContent = `
          .turno-numero:not(.sin-turno) { color: ${colorPrimario}; text-shadow: 0 0 60px ${colorPrimario}55; }
          .turno-puesto { background: ${colorSecundario}; }
          .ticker-content .sep { color: ${colorSecundario}; }
          #reloj { color: ${colorPrimario}; }
          .turno-badge.mas-reciente { background: ${colorPrimario}33; border-color: ${colorPrimario}; color: ${colorPrimario}; }
          .turno-badge.mas-reciente .badge-puesto { color: ${colorPrimario}cc; }
        `;

        if (config.video_fuente === 'archivo' && config.video_url) {
          const videoEl = document.getElementById('video-uploaded');
          videoEl.src = config.video_url;
          videoEl.style.display = 'block';
          videoEl.play().catch(() => {});
        } else if (config.videoYoutube) {
          const frame = document.getElementById('video-frame');
          frame.src = config.videoYoutube + '?autoplay=1&mute=1&loop=1&playlist=' + getYtId(config.videoYoutube);
          frame.style.display = 'block';
        }

        if (config.mensaje) {
          document.getElementById('ticker-mensaje').textContent = config.mensaje;
        }

        if (config.horario_apertura || config.horario_cierre) {
          const ap = config.horario_apertura || '07:00';
          const ci = config.horario_cierre || '17:00';
          document.getElementById('ticker-horario').textContent = `Horario de atención: ${ap} – ${ci}`;
        }

        ajustarVelocidadTicker();
        if (config.voz_tts) window._vozTts = config.voz_tts;
        if (config.font_family) document.body.style.fontFamily = config.font_family;
      } catch (e) { console.warn('Error al cargar config:', e); }
    }

    function getYtId(url) {
      const m = url.match(/embed\/([^?]+)/);
      return m ? m[1] : '';
    }

    function adjustColor(hex, amount) {
      const c = hex.replace('#','');
      const num = parseInt(c.length === 3 ? c.split('').map(x=>x+x).join('') : c, 16);
      const r = Math.max(0, Math.min(255, (num >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amount));
      const b = Math.max(0, Math.min(255, (num & 0xFF) + amount));
      return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    }

    function ajustarVelocidadTicker() {
      const ticker = document.getElementById('ticker-content');
      const text = ticker.textContent || '';
      const dur = Math.max(20, Math.round(text.length * 0.18));
      ticker.style.animationDuration = dur + 's';
    }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ===== TURN DISPLAY =====
    function mostrarTurno(turno) {
      const numEl = document.getElementById('turno-numero');
      numEl.classList.remove('sin-turno', 'animando');
      numEl.textContent = turno.numero;
      void numEl.offsetWidth;
      numEl.classList.add('animando');

      document.getElementById('turno-area').textContent = turno.area || '';

      const puestoEl = document.getElementById('turno-puesto');
      if (turno.ventanilla) {
        puestoEl.textContent = 'Puesto: ' + turno.ventanilla;
        puestoEl.style.display = 'block';
      } else {
        puestoEl.style.display = 'none';
      }

      // Update badge list (most recent first, deduplicate)
      const key = turno.numero + '|' + (turno.ventanilla || '');
      const existing = turnosLlamados.findIndex(t => (t.numero + '|' + (t.ventanilla || '')) === key);
      if (existing !== -1) turnosLlamados.splice(existing, 1);
      turnosLlamados.unshift(turno);
      if (turnosLlamados.length > MAX_LISTA) turnosLlamados.pop();

      renderBadges();
      anunciarVoz(turno);
    }

    function renderBadges() {
      const wrap = document.getElementById('turnos-badges');
      wrap.innerHTML = turnosLlamados.map((t, i) => {
        const puestoHtml = t.ventanilla
          ? `<span class="badge-puesto">${escHtml(t.ventanilla)}</span>`
          : (t.area ? `<span class="badge-puesto">${escHtml(t.area)}</span>` : '');
        return `<div class="turno-badge${i === 0 ? ' mas-reciente' : ''}">
          ${escHtml(t.numero)}${puestoHtml}
        </div>`;
      }).join('');
    }

    // ===== TTS =====
    function anunciarVoz(turno) {
      if (!window.speechSynthesis) return;
      const msg = new SpeechSynthesisUtterance();
      const vent = turno.ventanilla ? `, diríjase al puesto ${turno.ventanilla}` : '';
      msg.text = `Turno ${turno.numero}, ${turno.area || ''}${vent}`;
      msg.rate = 0.9; msg.volume = 1;
      const vozNombre = window._vozTts || null;
      const voices = window.speechSynthesis.getVoices();
      let voz = vozNombre ? voices.find(v => v.name === vozNombre) : null;
      if (!voz) voz = voices.find(v => v.lang && v.lang.startsWith('es')) || null;
      if (voz) msg.voice = voz; else msg.lang = 'es-ES';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    }

    socket.on('turn_called', mostrarTurno);

    // ===== INIT =====
    cargarConfig().then(() => {
      if (sucursalId) {
        socket.emit('join_branch', { sucursal_id: sucursalId });
      }
    });
  </script>
</body>
</html>
